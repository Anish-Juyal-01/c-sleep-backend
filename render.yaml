services:
  - type: web
    name: c-sleep-backend
    env: python
    plan: free # Uses the free instance type
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5 # Pinning the python version for consistency
      - key: API_KEY
        sync: false # Ensures you must set this secret key in the Render dashboard